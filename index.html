<script>

var total=0;
var operator='';
var storednumber=0;

function handleOperatorPlus(){

    if(operator==''){
        storednumber=total;
        total=0;
    }
    else if(operator=='+'){
        storednumber+=total;
        total=0;
    }
    else if(operator=='-'){
        storednumber-=total;
        total=0;
    }
    else if(operator=='*'){
        storednumber*=total;
        total=0;
    }
    else if(operator=='/'){
        storednumber/=total;
        total=0;
    }
    else if(operator=='%'){
        storednumber%=total;
        total=0;
    }

    document.getElementById('nftext').innerHTML=storednumber;
    operator='+';
}


function handleOperatorMinus(){

    if(operator==''){
        storednumber=total;
        document.getElementById('nftext').innerHTML=storednumber;
        total=0;
    }
    else if(operator=='+'){
        storednumber+=total;
         document.getElementById('nftext').innerHTML=storednumber;
        total=0;
    }
    else if(operator=='-'){
        storednumber-=total;
        document.getElementById('nftext').innerHTML=storednumber;
        total=0;
    }
    else if(operator=='*'){
        storednumber*=total;
        document.getElementById('nftext').innerHTML=storednumber;
        total=0;
    }
    else if(operator=='/'){
        storednumber/=total;
        document.getElementById('nftext').innerHTML=storednumber;
        total=0;
    }
    else if(operator=='%'){
        storednumber%=total;
        document.getElementById('nftext').innerHTML=storednumber;
        total=0;
    }

    document.getElementById('nftext').innerHTML=storednumber;
    operator='-';
}


function handleOperatorMultiply(){

    if(operator==''){
        storednumber=total;
        document.getElementById('nftext').innerHTML=storednumber;
        total=0;
    }
    else if(operator=='+'){
        storednumber+=total;
        document.getElementById('nftext').innerHTML=storednumber;
        total=0;
    }
    else if(operator=='-'){
        storednumber-=total;
        document.getElementById('nftext').innerHTML=storednumber;
        total=0;
    }
    else if(operator=='*'){
        storednumber*=total;
        document.getElementById('nftext').innerHTML=storednumber;
        total=0;
    }
    else if(operator=='/'){
        storednumber/=total;
        document.getElementById('nftext').innerHTML=storednumber;
        total=0;
    }
    else if(operator=='%'){
        storednumber%=total;
        document.getElementById('nftext').innerHTML=storednumber;
        total=0;
    }

    document.getElementById('nftext').innerHTML=storednumber;
    operator='*';
}


function handleOperatorDivide(){

    if(operator==''){
        storednumber=total;
        document.getElementById('nftext').innerHTML=storednumber;
        total=0;
    }
    else if(operator=='+'){
        storednumber+=total;
        document.getElementById('nftext').innerHTML=storednumber;
        total=0;
    }
    else if(operator=='-'){
        storednumber-=total;
        document.getElementById('nftext').innerHTML=storednumber;
        total=0;
    }
    else if(operator=='*'){
        storednumber*=total;
        document.getElementById('nftext').innerHTML=storednumber;
        total=0;
    }
    else if(operator=='/'){
        storednumber/=total;
        document.getElementById('nftext').innerHTML=storednumber;
        total=0;
    }
    else if(operator=='%'){
        storednumber%=total;
        document.getElementById('nftext').innerHTML=storednumber;
        total=0;
    }

    document.getElementById('nftext').innerHTML=storednumber;
    operator='/';
}

function handleOperatorsqrt(){

    total=Math.sqrt(total);
    document.getElementById('nftext').innerHTML=total;
    storednumber=0;
    operator='';
}



function handleOperatorpercentage(){
    total=total/100;
    document.getElementById('nftext').innerHTML=total;
}

function handleOperatorAC(){
    total=0;
    storednumber=0;
    operator='';
    document.getElementById('nftext').innerHTML=0;

}

function handleOperatorEqual(){
    if(operator=='+'){
        storednumber+=total;
        document.getElementById('nftext').innerHTML=storednumber;
    }
    else if(operator=='-'){
        storednumber-=total;
        document.getElementById('nftext').innerHTML=storednumber;
    }
    else if(operator=='*'){
        storednumber*=total;
        document.getElementById('nftext').innerHTML=storednumber;
    }
    else if(operator=='/'){
        storednumber/=total;
        document.getElementById('nftext').innerHTML=storednumber;
    }

    else if(operator=='%'){
    storednumber%=total;
    document.getElementById('nftext').innerHTML=storednumber;
}

    total=0;
    operator='';
}
